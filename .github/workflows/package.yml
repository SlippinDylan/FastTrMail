name: package-extension

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read extension version
        id: version
        run: |
          VERSION="$(jq -r '.version' extension/manifest.json)"
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Package extension
        run: bash scripts/package.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fasttrmail-${{ steps.version.outputs.value }}
          path: |
            dist/fasttrmail
            dist/fasttrmail-${{ steps.version.outputs.value }}.zip

      - name: Write workflow summary
        run: |
          {
            echo "## FastTrMail package"
            echo ""
            echo "- Version: \`${VERSION}\`"
            echo "- Unpacked directory: \`dist/fasttrmail/\`"
            echo "- Release zip: \`dist/fasttrmail-${VERSION}.zip\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish latest release asset
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES_FILE="$(mktemp)"
          {
            echo "Automated latest build from \`main\`."
            echo ""
            echo "- Version: \`${VERSION}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
          } > "$NOTES_FILE"

          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "Latest (${VERSION})" --notes-file "$NOTES_FILE"
          else
            gh release create latest --title "Latest (${VERSION})" --notes-file "$NOTES_FILE"
          fi

          gh release view latest --json assets --jq '.assets[].name' \
            | while IFS= read -r asset_name; do
                if [[ "$asset_name" == fasttrmail-*.zip ]]; then
                  gh release delete-asset latest "$asset_name" --yes >/dev/null 2>&1 || true
                fi
              done

          gh release upload latest \
            "dist/fasttrmail-${VERSION}.zip" \
            --clobber
