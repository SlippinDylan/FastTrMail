name: package-extension

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_run:
    workflows:
      - ci
    types:
      - completed
  workflow_dispatch:

jobs:
  package:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TESTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1.7.3

      - name: Read extension version
        id: version
        run: |
          VERSION="$(jq -r '.version' extension/manifest.json)"
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Package extension
        run: bash scripts/package.sh

      - name: Restore extension signing key
        env:
          CHROME_EXTENSION_PEM_BASE64: ${{ secrets.CHROME_EXTENSION_PEM_BASE64 }}
        run: |
          PEM_PATH="$RUNNER_TEMP/fasttrmail.pem"
          printf '%s' "$CHROME_EXTENSION_PEM_BASE64" | base64 --decode > "$PEM_PATH"
          chmod 600 "$PEM_PATH"
          echo "CHROME_EXTENSION_PEM_PATH=$PEM_PATH" >> "$GITHUB_ENV"

      - name: Package signed CRX
        run: bash scripts/package-crx.sh

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fasttrmail-${{ steps.version.outputs.value }}
          path: |
            dist/fasttrmail
            dist/fasttrmail-${{ steps.version.outputs.value }}.zip
            dist/fasttrmail-${{ steps.version.outputs.value }}.crx

      - name: Write workflow summary
        run: |
          {
            echo "## FastTrMail package"
            echo ""
            echo "- Version: \`${VERSION}\`"
            echo "- Unpacked directory: \`dist/fasttrmail/\`"
            echo "- Release zip: \`dist/fasttrmail-${VERSION}.zip\`"
            echo "- Release crx: \`dist/fasttrmail-${VERSION}.crx\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish versioned release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="$VERSION"
          RELEASE_TITLE="v$VERSION"
          NOTES_FILE="$(mktemp)"
          {
            echo "Automated release build from \`main\`."
            echo ""
            echo "- Version: \`${VERSION}\`"
            echo "- Commit: \`${TESTED_SHA}\`"
          } > "$NOTES_FILE"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            CURRENT_RELEASE_SHA="$(gh release view "$TAG_NAME" --json targetCommitish --jq '.targetCommitish')"
            if [[ "$CURRENT_RELEASE_SHA" != "$TESTED_SHA" ]]; then
              echo "Version $VERSION is already published for commit $CURRENT_RELEASE_SHA. Bump extension/manifest.json before publishing a new release from $TESTED_SHA." >&2
              exit 1
            fi
            gh release edit "$TAG_NAME" --title "$RELEASE_TITLE" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG_NAME" --target "$TESTED_SHA" --title "$RELEASE_TITLE" --notes-file "$NOTES_FILE"
          fi

          gh release view "$TAG_NAME" --json assets --jq '.assets[].name' \
            | while IFS= read -r asset_name; do
                if [[ "$asset_name" == fasttrmail-${VERSION}.zip || "$asset_name" == fasttrmail-${VERSION}.crx ]]; then
                  gh release delete-asset "$TAG_NAME" "$asset_name" --yes >/dev/null 2>&1 || true
                fi
              done

          gh release upload "$TAG_NAME" \
            "dist/fasttrmail-${VERSION}.zip" \
            "dist/fasttrmail-${VERSION}.crx" \
            --clobber
